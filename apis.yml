name: Fintech
description: >-
  Fin (fin.tech) is a crypto-native payments company that lets users and businesses move millions of
  dollars instantly — to other Fin users, directly into bank accounts, or across crypto rails. It
  provides business-grade payment rails that feel like a consumer payment app rather than crypto:
  instant global settlement in seconds, native support to deposit and withdraw to bank accounts, and
  send/receive of USDT, USDC, ETH, and BTC, while Fin abstracts the underlying crypto settlement
  behind a clean fintech interface. Backed by Sequoia, Multicoin, and Pantera Capital, Fin operates a
  private, auth-gated production API surface (api.fin.tech) and publishes an llms.txt for agents; it
  does not currently publish a public developer portal, OpenAPI, or SDKs. Surfaced in the API
  Evangelist network as a Pantera Capital portfolio company (sector: crypto) and enriched from its
  public web surface.
